  <title>오쭈다 아지트 · 공원 | 오늘 하루 어땠나요? 괜찮았나요</title>
  <meta name="description" content="오쭈다 아지트 공원으로 이동합니다.">
  <link rel="canonical" href="https://ojjuda.kr/world.html?place=park">
  <script>
    (() => {
      const incoming = new URL(location.href);
      const target = new URL('https://ojjuda.kr/');
      target.pathname = incoming.pathname;
      target.search = incoming.search;
      target.hash = incoming.hash;
      if (['/', '/index.html', '/world', '/world.html'].includes(incoming.pathname)) {
        const hash = new URLSearchParams(incoming.hash.slice(1));
        const accountKeys = ['auth', 'next', 'reset', 'code', 'token', 'token_hash', 'type', 'access_token', 'refresh_token', 'error', 'error_code', 'error_description'];
        const accountEntry = accountKeys.some(key => incoming.searchParams.has(key) || hash.has(key));
        target.pathname = accountEntry ? '/' : '/world.html';
        if (accountEntry) {
          if (!target.searchParams.has('next')) target.searchParams.set('next', 'note');
        } else if (!target.searchParams.has('tab') && !target.searchParams.has('place')) {
          target.searchParams.set('place', 'park');
        }
      }
      location.replace(target.href);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=https://ojjuda.kr/world.html?place=park">
</head>
<body>
  <p>오쭈다 아지트 공원으로 이동합니다. <a href="https://ojjuda.kr/world.html?place=park">바로 들어가기</a></p>
